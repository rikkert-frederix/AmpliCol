[package]
name = "rusticol"
version = "0.1.0"
edition = "2024"

[lib]
name = "rusticol"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "2.0"
libc = "0.2"
symbolica = { path = "../pyAmpliCol/dependencies/symbolica", default-features = true, features = ["bincode"] }

[patch.crates-io]
numerica = { path = "../pyAmpliCol/dependencies/symbolica/lib/numerica" }
graphica = { path = "../pyAmpliCol/dependencies/symbolica/lib/graphica" }
