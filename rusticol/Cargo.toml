[package]
name = "rusticol"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["rusticol-capi"]
resolver = "2"

[lib]
name = "rusticol"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3", "dep:numpy"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.28", optional = true }
numpy = { version = "0.28", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "2.0"
libc = "0.2"
wide = "1.3"
symbolica = { path = "../pyAmpliCol/dependencies/symbolica", default-features = true, features = ["bincode"] }

[patch.crates-io]
numerica = { path = "../pyAmpliCol/dependencies/symbolica/lib/numerica" }
graphica = { path = "../pyAmpliCol/dependencies/symbolica/lib/graphica" }
